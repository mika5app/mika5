name: Deploy Landing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**']

# This workflow holds the keys to the web server. The repository is public, so:
# it runs only for pushes to main and manual runs (never for pull requests),
# its token can only read, and the third-party actions that receive the SSH key
# are pinned to an exact commit instead of a tag that can be moved.
permissions:
  contents: read

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Copy web files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "web/*"
          target: "/var/www/html/"
          strip_components: 1

      - name: Set landing as index
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cp /var/www/html/landing.html /var/www/html/index.html
