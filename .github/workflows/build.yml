name: Build and Publish MIKA5 Community

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mika5-community-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  canonical:
    uses: ./.github/workflows/_canonical.yml
    with:
      force-package: ${{ github.ref_type == 'tag' }}

  prepare-release:
    name: Prepare public draft release
    needs: canonical
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Validate release destination
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN"
          test -n "$RELEASES_REPO"

          PRIVATE="$(gh api "repos/$RELEASES_REPO" --jq '.private')"

          if [[ "$PRIVATE" != "false" ]]; then
            echo "Release repository must be public: $RELEASES_REPO"
            exit 1
          fi

      - name: Create or reset draft release
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # MIKA5 Community ${TAG}

          Free and open-source local AI desktop edition licensed under AGPL-3.0.

          ## Downloads

          - Windows installer and portable executable
          - macOS packages for Intel and Apple Silicon
          - Linux AppImage, DEB, and RPM packages
          - Corresponding source archive
          - License, build instructions, build metadata, and SHA-256 checksums

          ## Runtime requirements

          - A configured AI provider: Ollama (local or cloud models), llama.cpp, or an optional cloud provider
          - For local document indexing: Ollama with an embedding model (default: nomic-embed-text)
          - Cloud requests retain their privacy notices and consent

          ## macOS notice

          These builds are not notarized. macOS may show a security warning on first launch.

          Source commit: ${GITHUB_SHA}
          EOF

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            DRAFT="$(gh api "repos/$RELEASES_REPO/releases/tags/$TAG" --jq '.draft')"

            if [[ "$DRAFT" != "true" ]]; then
              echo "A published release already exists for $TAG"
              exit 1
            fi

            RELEASE_ID="$(gh api "repos/$RELEASES_REPO/releases/tags/$TAG" --jq '.id')"

            while read -r ASSET_ID; do
              [[ -z "$ASSET_ID" ]] && continue
              gh api --method DELETE "repos/$RELEASES_REPO/releases/assets/$ASSET_ID"
            done < <(gh api "repos/$RELEASES_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[].id')

            gh release edit "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "MIKA5 Community $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --target main \
              --draft \
              --title "MIKA5 Community $TAG" \
              --notes-file release-notes.md
          fi

  finalize-release:
    name: Verify and publish Community release
    needs: [canonical, prepare-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Require verified artifact identity
        env:
          VERIFIED_ARTIFACT_ID: ${{ needs.canonical.outputs.artifact-id }}
        run: test -n "$VERIFIED_ARTIFACT_ID"

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.canonical.outputs.artifact-id }}
          merge-multiple: true
          path: staging

      - name: Verify the downloaded producer proofs again
        run: node scripts/ci/verify-artifacts.js --dir=staging --commit="$GITHUB_SHA"

      - name: Create corresponding source archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          mkdir -p release-assets

          git archive \
            --format=tar.gz \
            --prefix="MIKA5-${VERSION}-source/" \
            --output="release-assets/MIKA5-${VERSION}-source.tar.gz" \
            "$GITHUB_SHA"

      - name: Create build metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          # La versión de Node se lee de la fuente canónica. Este job no
          # instala Node, así que antes tomaba la variable global del
          # workflow: al desaparecer ésta, el metadata la lee de .nvmrc, que
          # es lo mismo que `setup-node` usa en los jobs que sí construyen.
          NODE_VERSION="$(cat .nvmrc)"

          cat > release-assets/BUILD-METADATA.json <<EOF
          {
            "product": "MIKA5 Community",
            "version": "${VERSION}",
            "tag": "${TAG}",
            "license": "AGPL-3.0",
            "source_commit": "${GITHUB_SHA}",
            "source_repository": "https://github.com/${GITHUB_REPOSITORY}",
            "release_repository": "https://github.com/${RELEASES_REPO}",
            "node_version": "${NODE_VERSION}",
            "workflow_run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Assemble exact release inventory and checksums
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const { construirManifiesto } = require('./scripts/ci/artifact-manifest');
          const manifest = construirManifiesto({ commit: process.env.GITHUB_SHA });
          for (const item of manifest.artifacts) {
            fs.copyFileSync(path.join('staging', item.producer, item.name), path.join('release-assets', item.name), fs.constants.COPYFILE_EXCL);
          }
          for (const name of ['LICENSE', 'BUILDING.md', 'COMMUNITY.md']) fs.copyFileSync(name, path.join('release-assets', name), fs.constants.COPYFILE_EXCL);
          NODE
          (
            cd release-assets
            sha256sum -- * > ../SHA256SUMS.txt
          )
          mv SHA256SUMS.txt release-assets/SHA256SUMS.txt

      - name: Upload verified release files
        shell: bash
        run: gh release upload "$TAG" release-assets/* --repo "$RELEASES_REPO" --clobber

      - name: Verify uploaded bytes and inventory
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$RELEASES_REPO" --dir verify-assets
          node - <<'NODE'
          const fs = require('fs');
          const expected = fs.readdirSync('release-assets').sort();
          const actual = fs.readdirSync('verify-assets').sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Unexpected public release inventory');
          NODE
          cmp release-assets/SHA256SUMS.txt verify-assets/SHA256SUMS.txt
          (
            cd verify-assets
            sha256sum --check ../release-assets/SHA256SUMS.txt
          )

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "$TAG" \
            --repo "$RELEASES_REPO" \
            --draft=false \
            --prerelease=false \
            --latest

      - name: Show public release
        run: gh release view "$TAG" --repo "$RELEASES_REPO"
