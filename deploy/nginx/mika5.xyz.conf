# nginx site for https://mika5.xyz — the public landing served from /var/www/html.
#
# Written for the server that serves the site today: nginx 1.24 (Ubuntu) with
# a Let's Encrypt certificate that already covers mika5.xyz and www.mika5.xyz.
# It replaces only the server blocks for those two names; other sites on the
# same machine are not touched.
#
# Install (as root), keeping a copy of what is there now:
#   cp /etc/nginx/sites-available/<current mika5 file> ~/nginx-mika5-backup.conf
#   cp deploy/nginx/mika5.xyz.conf /etc/nginx/sites-available/mika5.xyz.conf
#   ln -sf /etc/nginx/sites-available/mika5.xyz.conf /etc/nginx/sites-enabled/
#   (remove the old mika5 link from sites-enabled so the names are not served twice)
#   nginx -t && systemctl reload nginx
# If `nginx -t` fails, nothing is reloaded and the old configuration keeps running.
#
# What it fixes, from the site audit:
#   - an address that does not exist answered 200 with the home page, so search
#     engines and answer engines indexed copies of it; it now answers 404
#   - www.mika5.xyz served its own copy; it now redirects to mika5.xyz
#   - /index.html, /landing.html and /es/index.html are other addresses for the
#     two home pages; they redirect to / and /es/
#   - JavaScript, CSS, SVG and text were sent uncompressed (only HTML was gzipped)
#   - static files had no cache lifetime, and there were no security headers

# Cache lifetime by response type. HTML is revalidated on every visit, so a new
# deploy is seen at once; file names are not fingerprinted, so assets get days,
# not a year.
map $sent_http_content_type $mika5_expires {
    default                   off;
    ~^text/html               epoch;
    ~^text/css                1d;
    ~javascript               1d;
    ~^text/plain              1h;
    ~^application/xml         1h;
    ~^image/                  7d;
    ~^font/                   30d;
}

# Duplicate addresses of the two home pages. $request_uri is the address the
# visitor asked for, so the internal rewrite `index` does for "/" never matches.
map $request_uri $mika5_home_redirect {
    default                          "";
    ~^/index\.html(?:\?.*)?$         /;
    ~^/landing\.html(?:\?.*)?$       /;
    ~^/es/index\.html(?:\?.*)?$      /es/;
}

server {
    listen 80;
    listen [::]:80;
    server_name mika5.xyz www.mika5.xyz;

    # Let's Encrypt renewals over HTTP keep working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://mika5.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mika5.xyz;

    ssl_certificate     /etc/letsencrypt/live/mika5.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mika5.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mika5.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mika5.xyz;

    ssl_certificate     /etc/letsencrypt/live/mika5.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mika5.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/xml application/javascript
               application/json application/ld+json image/svg+xml image/x-icon;

    expires $mika5_expires;

    # Security headers. They are set here and nowhere else: an add_header inside
    # a location would drop all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    # The pages keep their dictionaries and the language switcher in inline
    # scripts, hence 'unsafe-inline'. Every external origin they load is listed:
    # Google Fonts for the typefaces; Tailwind is a compiled file on this site.
    # The Pro notify form posts to Buttondown.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action https://buttondown.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    if ($mika5_home_redirect) {
        return 301 $mika5_home_redirect;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The deploy copies the whole web/ folder; nothing in it is private, but
    # editor and VCS leftovers are never served.
    location ~ /\.(?!well-known/) {
        return 404;
    }
}
